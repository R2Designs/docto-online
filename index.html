<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docto Online — your first-step health guide</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23BBD7F0'/><text x='50' y='68' font-size='52' text-anchor='middle' font-family='Georgia'>D</text></svg>">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{ --bg:#ffffff; --panel:#f5f5f5; --bubble:#f4f4f4; --line:#e6e6e6; --ink:#1c1c1c; --mut:#8a8a8a; --blue:#bbd7f0; --blueD:#8fbde6; --accent:#2f6ea8; --red:#c0392b; --green:#2e7d51; }
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif; color:var(--ink); background:var(--bg); height:100vh; overflow:hidden;}
.serif{font-family:Georgia,'Times New Roman',serif; font-style:italic;}
#topbar{height:56px; display:flex; align-items:center; gap:14px; padding:0 22px; border-bottom:1px solid var(--line); background:#fff; position:relative; z-index:5;}
#topbar .logo{font-weight:700; letter-spacing:.5px;}
#topbar .logo span{color:var(--mut); font-weight:400; margin-left:6px;}
#topbar .grow{flex:1;}
select#langSel{border:1px solid var(--line); background:#fff; padding:6px 10px; border-radius:8px; font-size:13px; color:var(--ink);}
#userChip{font-size:13px; color:var(--mut); display:flex; align-items:center; gap:8px;}
#userChip img{width:26px;height:26px;border-radius:50%;}
#userChip button{border:none;background:none;color:var(--accent);cursor:pointer;font-size:12px;}
#layout{display:flex; height:calc(100vh - 56px);}
/* sidebar */
#side{width:300px; min-width:240px; background:var(--panel); padding:18px 16px; overflow-y:auto;}
#newBtn{width:100%; padding:11px; border:none; border-radius:10px; background:var(--blue); font-size:14px; font-weight:600; cursor:pointer; margin-bottom:16px;}
#newBtn:hover{background:var(--blueD);}
.histCard{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 12px 10px; margin-bottom:12px; cursor:pointer; transition:box-shadow .15s;}
.histCard:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
.histCard h4{font-size:14px; margin-bottom:4px; display:flex; justify-content:space-between; gap:6px;}
.histCard h4 small{color:var(--mut); font-weight:400; font-size:11px; white-space:nowrap;}
.histCard p{font-size:12px; color:var(--mut); line-height:1.45; max-height:52px; overflow:hidden;}
.histCard .rowBtns{margin-top:8px; display:flex; gap:10px;}
.histCard .rowBtns button{font-size:11px; border:none; background:none; color:var(--accent); cursor:pointer; padding:0;}
.histCard .rowBtns button.del{color:var(--red);}
#histEmpty{font-size:13px;color:var(--mut); text-align:center; margin-top:30px; line-height:1.6;}
.sideTitle{font-size:12px; letter-spacing:1px; color:var(--mut); text-transform:uppercase; margin:6px 0 12px;}
/* main */
#main{flex:1; display:flex; flex-direction:column; position:relative;}
#chatHead{padding:26px 40px 8px;}
#chatHead h1{font-size:44px; font-weight:500;}
#chat{flex:1; overflow-y:auto; padding:10px 40px 20px; scroll-behavior:smooth;}
.row{display:flex; gap:12px; margin:14px 0; align-items:flex-start; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1;}}
.row .av{width:40px; height:40px; border-radius:50%; background:#dcdcdc; flex:none; display:flex; align-items:center; justify-content:center; font-size:17px;}
.row.bot .av{background:var(--blue);}
.bub{background:var(--bubble); border-radius:12px; padding:14px 18px; max-width:72%; font-size:14.5px; line-height:1.6; white-space:pre-wrap; word-wrap:break-word;}
.row.user{flex-direction:row-reverse;}
.row.user .bub{background:#e9f1fa;}
.bub h3{font-size:15px; margin:12px 0 6px; color:var(--accent);}
.bub h3:first-child{margin-top:0;}
.bub ul{margin:4px 0 8px 18px;}
.bub li{margin:5px 0;}
.bub .tag{display:inline-block; font-size:11px; background:#fff; border:1px solid var(--line); padding:2px 8px; border-radius:20px; color:var(--mut); margin-right:6px;}
.bub .emg{background:#fdecea; border:1px solid #f5c6c0; border-radius:10px; padding:10px 12px; margin:8px 0; color:var(--red);}
.bub .okv{color:var(--green);}
.bub table{border-collapse:collapse; margin:6px 0; font-size:13px; background:#fff;}
.bub td,.bub th{border:1px solid var(--line); padding:5px 9px; text-align:left;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.chip{border:1px solid var(--blueD); background:#fff; color:var(--accent); border-radius:20px; padding:7px 14px; font-size:13px; cursor:pointer; transition:.12s;}
.chip:hover{background:var(--blue); color:var(--ink);}
.chip.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
.chip.done{opacity:.55; pointer-events:none;}
.chipRowBtn{margin-top:8px;}
.bigBtn{border:none; background:var(--blue); border-radius:8px; padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer;}
.bigBtn:hover{background:var(--blueD);}
.ghostBtn{border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer; color:var(--ink);}
/* input bar */
#barWrap{padding:14px 40px 22px; background:#fff;}
#bar{display:flex; gap:12px; align-items:stretch;}
#attach{width:52px; border-radius:8px; border:none; background:#8b8b8b; color:#fff; font-size:20px; cursor:pointer; flex:none;}
#attach:hover{background:#6f6f6f;}
#inp{flex:1; border:none; background:#e4e4e4; border-radius:8px; padding:14px 16px; font-size:14.5px; outline:none;}
#send{width:150px; border:none; border-radius:8px; background:var(--blue); font-size:15px; font-weight:600; cursor:pointer; flex:none;}
#send:hover{background:var(--blueD);}
#fileIn{display:none;}
#micro{font-size:11px; color:var(--mut); margin-top:8px; text-align:center;}
/* overlay auth */
#overlay{position:fixed; inset:0; background:#fff; z-index:50; display:flex; align-items:center; justify-content:center;}
#authCard{width:min(440px,92vw); text-align:center;}
#authCard .logoBig{font-size:34px; font-weight:700;}
#authCard .logoBig span{color:var(--mut); font-weight:400;}
#authCard p.tg{color:var(--mut); margin:6px 0 30px;}
.langGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0 26px;}
.langGrid button{padding:12px 6px; border:1px solid var(--line); background:#fff; border-radius:10px; font-size:15px; cursor:pointer;}
.langGrid button.sel{border-color:var(--accent); background:#e9f1fa; font-weight:600;}
#authCard input{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:14px; margin:8px 0 14px;}
#gBtnHolder{display:flex; justify-content:center; margin-bottom:12px; min-height:40px;}
#guestBtn{width:100%; padding:12px; border:none; background:var(--blue); border-radius:10px; font-size:14px; font-weight:600; cursor:pointer;}
#authNote{font-size:11px; color:var(--mut); margin-top:16px; line-height:1.6;}
/* typing dots */
.dots{display:inline-block;}
.dots span{display:inline-block; width:7px; height:7px; margin:0 2px; background:#b5b5b5; border-radius:50%; animation:blink 1.2s infinite;}
.dots span:nth-child(2){animation-delay:.2s;} .dots span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,70%,100%{opacity:.25;} 35%{opacity:1;}}
/* printable report */
#sheetWrap{display:none;}
@media print{
 body>*{display:none !important;}
 #sheetWrap{display:block !important; position:static; overflow:visible;}
 body{overflow:visible; height:auto;}
}
#sheet{font-family:Georgia,serif; color:#111; padding:34px 44px; max-width:820px; margin:auto;}
#sheet .rHead{display:flex; justify-content:space-between; border-bottom:3px double #333; padding-bottom:12px;}
#sheet .rHead h2{font-size:26px;} #sheet .rHead h2 span{color:#777; font-weight:400;}
#sheet .rHead .sub{font-size:12px; color:#555; margin-top:4px;}
#sheet .meta{display:flex; flex-wrap:wrap; gap:6px 26px; font-size:13px; margin:14px 0; border-bottom:1px solid #ccc; padding-bottom:10px;}
#sheet h3{font-size:15px; margin:16px 0 6px; border-bottom:1px solid #ddd; padding-bottom:3px; letter-spacing:.4px;}
#sheet p, #sheet li{font-size:13.5px; line-height:1.65;}
#sheet ul{margin:4px 0 6px 20px;}
#sheet table{width:100%; border-collapse:collapse; margin:8px 0; font-size:13px;}
#sheet td,#sheet th{border:1px solid #bbb; padding:6px 8px; text-align:left;}
#sheet .warn{border:1.5px solid #b03a2e; padding:10px 12px; margin:12px 0; font-size:13px; background:#fdf3f2;}
#sheet .sig{margin-top:34px; display:flex; justify-content:space-between; align-items:flex-end;}
#sheet .sig .ai{font-size:12px; color:#555; border-top:1px solid #999; padding-top:6px;}
#sheet .disc{font-size:10.5px; color:#777; margin-top:22px; border-top:1px solid #ccc; padding-top:8px; line-height:1.5;}
@media (max-width:840px){ #side{display:none;} #chatHead h1{font-size:30px;} #chat{padding:10px 16px;} #barWrap{padding:10px 12px 16px;} .bub{max-width:86%;} }
</style>
</head>
<body>
<div id="topbar">
  <div class="logo serif-off"><span id="lg1">DOCTO</span><span id="lg2">ONLINE</span></div>
  <div class="grow"></div>
  <select id="langSel" title="Language"></select>
  <div id="userChip"></div>
</div>

<div id="layout">
  <aside id="side">
    <button id="newBtn">+ New ailment</button>
    <div class="sideTitle" id="histTitle">Previous diagnoses</div>
    <div id="histList"></div>
  </aside>
  <section id="main">
    <div id="chatHead"><h1 class="serif" id="pageTitle">Register new ailment</h1></div>
    <div id="chat"></div>
    <div id="barWrap">
      <div id="bar">
        <button id="attach" title="Upload report">📎</button>
        <input id="inp" autocomplete="off" placeholder="Type your answer here…">
        <button id="send">Submit</button>
      </div>
      <div id="micro"></div>
      <input type="file" id="fileIn" accept="image/*,.pdf">
    </div>
  </section>
</div>

<div id="overlay">
  <div id="authCard">
    <div class="logoBig">DOCTO <span>ONLINE</span></div>
    <p class="tg" id="tgLine">Your friendly first-step health guide</p>
    <div style="font-size:13px;color:#8a8a8a" id="clLabel">Choose your language</div>
    <div class="langGrid" id="langGrid"></div>
    <div id="gBtnHolder"></div>
    <input id="nameIn" placeholder="Your name">
    <button id="guestBtn">Continue without account</button>
    <div id="authNote">Google sign-in activates when this site is hosted on a domain with a configured Client ID (see README). Your data stays in your browser.</div>
  </div>
</div>

<div id="sheetWrap"><div id="sheet"></div></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
